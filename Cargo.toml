[package]
name = "arduino-uno-starter"
version = "0.1.0"
authors = ["Han Wu <wuhanstudios@gmail.com>", "Iris Webb <iriswebb8192@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
embedded-graphics = "0.8.2"
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
zlib-rs = { version = "0.6.3", default-features = false, features = ["c-allocator"] }
eg-seven-segment = "0.2.0"
femtofont = "0.5.0"
eg-femtofont = "0.1.0"
ttf-parser = { version = "0.25.1", default-features = false, features = [
    "opentype-layout", "no-std-float", "variable-fonts"
]}
log = "0.4"
parley = {default-features = false, version = "0.11.1", features=["libm"]}
swash = {default-features = false, version = "0.2.10", features=["libm", "scale", "render"]}


# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"
debug = true

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
codegen-units = 1

[lib]
crate-type = ["staticlib"]
