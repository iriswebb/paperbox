[package]
edition      = "2024"
name         = "boardbase-hal"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "boardbase-hal"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.1.0", default-features = true, features = ["esp32s3", "requires-unstable", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-alloc", "esp-radio"] }
esp-alloc = { version = "0.10.0", features = ["nightly"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
log = "0.4"

# Allows for truly statically allocated tasks instead of a bump allocator
embassy-executor = { version = "0.10.0", features = ["nightly"] }
embassy-time = "0.5.1"
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = { version = "2.1", features = ["nightly"] }

embedded-graphics = { version = "0.8", features = [] }
embedded-graphics-core = "0.4"

embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }
embedded-hal-async = "1.0.0"

# networking
embassy-net = { version = "0.9.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "udp",
    "dns",
] }
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false, features = ["log"] }
jiff = { version = "0.2.10", default-features = false, features = ["static"] }

# demos
xiao-epaper = {path = "../uc8179"}
demos = {path = "../demos"}
esp-radio = {version = "0.18.0", features = ["wifi", "esp32s3", "esp-alloc", "log-04"] }
sntpc-time-embassy = "0.6.0"
